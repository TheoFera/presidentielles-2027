name: Publier le jeu sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier et préparer le jeu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Tester le jeu
        run: npm test
      # Les images converties en WebP sont gardées d'une publication à l'autre.
      - name: Réutiliser les images WebP déjà converties
        uses: actions/cache@v4
        with:
          path: .cache/webp
          key: webp-${{ hashFiles('assets/images/**/*.png') }}
          restore-keys: webp-
      - name: Préparer les fichiers publics
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Mettre le jeu en ligne
        id: deployment
        uses: actions/deploy-pages@v4
