<!doctype html><html lang="fr"><meta charset="utf-8"><title>Candidats — animations de combat</title>
  <style>a{color:#b7e9ff}body{margin:0;padding:28px;background:#202b30;color:#fff2d6;font:16px system-ui}h1{margin:0 0 8px}p{color:#bccdcf;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{background:#e7e3d7;color:#25383d;border-radius:12px;overflow:hidden}.tile strong{display:block;padding:12px}canvas{display:block;width:100%;height:auto}</style>
  <h1 id="heading">Animations de combat</h1><p><a href="?candidate=melenchon">Mélenchon</a> · <a href="?candidate=le_pen">Marine Le Pen</a> · <a href="?candidate=philippe">Édouard Philippe</a></p><p>Garde, deux poings, coup de pied final, charge et saut · Planche choisie · Contours retouchés et échelle commune ajustée au sprite de base.</p><div class="grid" id="gallery"></div>
  <script type="module">
  import {loadConfig} from '../../src/config.js';
  import {GameSimulation} from '../../src/simulation/game-simulation.js';
  import {WorldRenderer} from '../../src/presentation/renderer.js';
  import {combatAtlases,combatAtlasFor} from '../../src/presentation/melenchon-combat.js';
  import {previewSkin} from './animation-preview-skins.js';
  const config=await loadConfig();
  const requested=new URLSearchParams(location.search).get('candidate');
  const faction=combatAtlases[requested]?requested:'le_pen';
  const skin=previewSkin(faction),definition=combatAtlasFor({faction_id:faction,current_campaign_style:skin});
  document.getElementById('heading').textContent=({melenchon:'Mélenchon',le_pen:'Marine Le Pen',philippe:'Édouard Philippe'})[faction]+' · '+(skin?document.querySelector('select').selectedOptions[0].textContent:'Costume de base');
  const specs=[['Sprite de base','base'],['Garde',null],['Poing 1 · préparation',1,0],['Poing 1 · impact',1,3],['Poing 2 · impact',2,3],['Pied · préparation',3,0],['Pied · impact',3,3],['Charge · concentration','focus'],['Charge · prête','ready'],['Charge · frappe','charged',3],['Saut','jump'],['Saut · coup de pied','air',3],['Coup vers la gauche','left',3]];
  for(const [label,kind,elapsed] of specs){
    const div=document.createElement('div');div.className='tile';const title=document.createElement('strong');title.textContent=label;div.append(title);
    const canvas=document.createElement('canvas');canvas.width=300;canvas.height=255;div.append(canvas);document.getElementById('gallery').append(div);
    const r=new WorldRenderer(canvas,config);r.resizeObserver.disconnect();await r.assets.load(definition.sprite);await r.assets.load('character-'+faction);if(skin)await r.assets.load('character-style-'+skin.replaceAll('_','-'));
    // Fixed drawing coordinates; CSS scales these static previews without clearing them.
    canvas.width=300;canvas.height=255;r.metrics={...r.metrics,characterHeight:155,groundY:232};r.ctx.fillStyle='#e7e3d7';r.ctx.fillRect(0,0,300,255);r.ctx.fillStyle='#c2c7b8';r.ctx.fillRect(0,232,300,23);
    const sim=new GameSimulation(config,42),s=sim.state,c=s.candidates.find(c=>c.faction_id===faction);s.npcs=[];s.tick=60;s.candidates.forEach(c=>c.x=300);c.x=100;c.facing=1;const enemy=s.candidates.find(e=>e.id!==c.id);enemy.x=103;
    c.current_campaign_style=skin;
    if(kind==='base'){enemy.x=200;}
    else if(['focus','ready'].includes(kind)){c.combat.charge_active=true;c.combat.press_tick=kind==='ready'?0:59;}
    else if(kind==='jump'){c.combat.jump_tick=54;c.combat.height=.3;}
    else if(kind!==null){c.combat.attack_id='pose';s.attacks=[{id:'pose',owner_id:c.id,kind:kind==='charged'?'CHARGED':'CANDIDATE',direction:kind==='left'?-1:1,step:typeof kind==='number'?kind:1,elapsed_ticks:elapsed,windup_ticks:3,active_ticks:3,recovery_ticks:6}];if(kind==='air'){c.combat.jump_tick=54;c.combat.height=.3;}}
    r.drawPerson(c,130,s);
  }
  window.galleryReady=true;
  </script></html>
