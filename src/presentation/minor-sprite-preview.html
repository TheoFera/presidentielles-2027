<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu des candidats secondaires</title>
<style>
  body { margin: 24px; background: #f8f0df; color: #292721; font: 16px system-ui; }
  h1 { font-size: 26px; } h2 { font-size: 20px; margin-top: 28px; }
  .poses { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  figure { margin: 0; text-align: center; background: #fffcf5; border: 1px solid #d7c8ab; border-radius: 8px; }
  canvas { width: 180px; height: 190px; } figcaption { padding: 8px; font-size: 13px; }
</style>
<h1>Candidats secondaires — douze poses par candidat</h1>
<p>Rendu utilisé dans le jeu, à taille constante et avec les pieds ancrés au sol.</p>
<main id="gallery"></main>
<script type="module">
  import { VisualAssets } from './visual-assets.js';
  import { visualManifest } from './visual-manifest.js';
  import { drawMinorCandidate, MINOR_LOOKS } from './minor-characters.js';
  import { MINOR_SPRITES, MINOR_SHEET_POSES } from './minor-sprites.js';
  import { prepareMinorFrames } from './minor-sprite-images.js';
  const assets = new VisualAssets(visualManifest, { prepareImage: (id, image) => prepareMinorFrames(image, id.slice(6)) });
  await assets.loadRequired(Object.keys(MINOR_SPRITES).map(id => `minor-${id}`));
  const labels = ['Repos', 'Marche A', 'Marche B', 'Course', 'Premier coup', 'Deuxième coup', 'Coup de pied', 'Charge', 'Blessure légère', 'Recul', 'KO', 'Persuasion'];
  for (const [faction, look] of Object.entries(MINOR_LOOKS)) {
    const section = document.createElement('section'), title = document.createElement('h2');
    title.textContent = look.fullName; section.append(title);
    const grid = document.createElement('div'); grid.className = 'poses'; section.append(grid);
    for (const [index, pose] of MINOR_SHEET_POSES.entries()) {
      const figure = document.createElement('figure'), canvas = document.createElement('canvas');
      canvas.width = 180; canvas.height = 190;
      const ctx = canvas.getContext('2d');
      const entity = { id: `candidate:${faction}`, minor: true, faction_id: faction, facing: 1, role: 'CANDIDAT', combat: {}, debate_hp: 100 };
      const state = { tick: index === 2 ? 10 : 0, attacks: [] };
      if (pose.startsWith('walk') || pose === 'run') entity.moving = true;
      if (pose === 'run') entity.combat.engaged = true;
      if (pose.startsWith('attack')) state.attacks.push({ owner_id: entity.id, kind: 'LIGHT', strong: pose === 'attack_heavy', step: pose === 'attack_light_2' ? 2 : 1, elapsed_ticks: 1, windup_ticks: 1, active_ticks: 1 });
      if (pose === 'charged_attack') entity.combat.charge_active = true;
      if (pose === 'hurt' || pose === 'knockback') { entity.combat.stun_ticks = 1; entity.combat.knockback_velocity = pose === 'knockback' ? 1 : 0; }
      if (pose === 'ko') entity.is_ko = true;
      if (pose === 'persuade') entity.persuasion_target_ids = ['électeur'];
      const renderer = { ctx, assets, metrics: { characterHeight: 125, groundY: 166 }, config: { balance: { simulation_architecture: { fixed_tick_hz: 60 } } }, p: { factions: { [faction]: { color: look.accent } } } };
      drawMinorCandidate(renderer, entity, 80, state);
      const caption = document.createElement('figcaption'); caption.textContent = labels[index];
      figure.append(canvas, caption); grid.append(figure);
    }
    document.querySelector('#gallery').append(section);
  }
  window.galleryReady = true;
</script>
</html>
