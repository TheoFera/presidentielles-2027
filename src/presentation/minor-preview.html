<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Candidats</title>
<style>body { margin: 0; background: #efe6d2; font: 14px system-ui, sans-serif; } canvas { display: block; max-width: 100%; height: auto; } h2 { margin: 12px; }</style>
</head>
<body>
<canvas id="sheet" width="1320" height="780"></canvas>
<div id="layouts"></div>
<script type="module">
  // Aperçu des six candidats mineurs dessinés par le code, et maquettes de planches (4 × 3 poses) pour ChatGPT.
  import { MINOR_LOOKS, drawMinorFigure } from './minor-characters.js';
  import { MINOR_SHEET, MINOR_SHEET_POSES } from './minor-sprites.js';
  const poses = [['idle', 0], ['walk', 0.1], ['run', 0.15], ['attack_light_1', 1], ['attack_light_2', 1], ['attack_heavy', 1], ['charged_attack', 0], ['hurt', 0], ['knockback', 0], ['persuade', 0.2], ['jump', 0]];
  const ctx = document.getElementById('sheet').getContext('2d');
  ctx.font = '600 12px system-ui'; ctx.fillStyle = '#3a342c';
  poses.forEach(([pose], i) => ctx.fillText(pose, 110 + i * 110, 20));
  Object.keys(MINOR_LOOKS).forEach((faction, row) => {
    const y = 140 + row * 122;
    ctx.fillStyle = '#3a342c'; ctx.fillText(MINOR_LOOKS[faction].name, 8, y - 40);
    ctx.fillStyle = '#d8ccb0'; ctx.fillRect(0, y, 1320, 3);
    poses.forEach(([pose, progress], i) => {
      ctx.save(); ctx.translate(150 + i * 110, y - (pose === 'jump' ? 20 : 0));
      drawMinorFigure(ctx, faction, 100, pose, 0.35, progress, pose === 'jump'); ctx.restore();
    });
  });
  // Maquettes de planches : même grille et même ordre que MINOR_SHEET_POSES, fond transparent.
  const exported = {};
  const cellW = MINOR_SHEET.width / MINOR_SHEET.columns, cellH = MINOR_SHEET.height / MINOR_SHEET.rows;
  const figure = { walk_a: ['walk', 0.1, 0.02], walk_b: ['walk', 0.1, 0.26], attack_light_1: ['attack_light_1', 1], attack_light_2: ['attack_light_2', 1], attack_heavy: ['attack_heavy', 1] };
  for (const faction of Object.keys(MINOR_LOOKS)) {
    const canvas = document.createElement('canvas'); canvas.width = MINOR_SHEET.width; canvas.height = MINOR_SHEET.height;
    const c = canvas.getContext('2d');
    MINOR_SHEET_POSES.forEach((pose, index) => {
      const [animation, progress, time] = figure[pose] || [pose, 0, 0.35];
      c.save(); c.translate((index % MINOR_SHEET.columns + 0.5) * cellW, Math.floor(index / MINOR_SHEET.columns) * cellH + MINOR_SHEET.feet);
      if (pose === 'ko') { c.translate(MINOR_SHEET.figure * 0.5, -MINOR_SHEET.figure * 0.12); c.rotate(-Math.PI / 2); }
      drawMinorFigure(c, faction, MINOR_SHEET.figure, animation, time, progress); c.restore();
    });
    const title = document.createElement('h2'); title.textContent = `${MINOR_LOOKS[faction].fullName} — maquette de planche`;
    canvas.style.background = 'repeating-conic-gradient(#d7dde2 0 25%, #f4f6f7 0 50%) 0 0 / 32px 32px';
    document.getElementById('layouts').append(title, canvas);
    exported[`${faction}-maquette.png`] = canvas.toDataURL('image/png');
  }
  if (new URLSearchParams(location.search).has('export'))
    for (const [name, data] of Object.entries(exported)) await fetch(`/__export?name=${encodeURIComponent(name)}`, { method: 'POST', body: data });
  document.title = 'Candidats prêts';
</script>
</body>
</html>
