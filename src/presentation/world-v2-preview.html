<!doctype html>
<html lang="fr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World-v2 — décor étendu</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172922;color:#f0e7d3;font:15px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px}h1{font-size:18px;margin:0}button,select{font:inherit;padding:7px 12px;background:#eeddb9;color:#243a30;border:0;border-radius:5px}label{display:flex;gap:8px;align-items:center}#game{display:block;width:100%;height:calc(100vh - 100px);min-height:300px}#status{margin:0;padding:8px 18px;font-size:13px}button{cursor:pointer}
</style>
<style>body{height:100dvh;display:flex;flex-direction:column}#viewport{flex:1;min-height:0;display:grid;place-items:center}#game{flex:none;width:100%;height:auto;min-height:0;aspect-ratio:16/9}header,#status{flex:none}</style>
<header><h1>World-v2 — décor étendu</h1><button id="previous">←</button><select id="zone" aria-label="Sous-zone"></select><button id="next">→</button><label><input id="join" type="checkbox"> Voir le raccord</label><label>Saison <select id="season"><option value="0">Été</option><option value="0.4">Automne</option><option value="0.6">Hiver</option><option value="0.9">Printemps</option></select></label></header>
<div id="viewport"><canvas id="game"></canvas></div><p id="status">Chargement des décors…</p>
<script type="module">
import {loadConfig} from '../config.js';
import {GameSimulation} from '../simulation/game-simulation.js';
import {WorldRenderer} from './renderer.js';
import {setMapDecor} from './map-decor.js';
import {worldAssetIds} from './illustrated-world.js';
setMapDecor('panoramas');
const config=await loadConfig(),sim=new GameSimulation(config,42),state=sim.state;
state.ai_enabled=false;state.campaign_style_selection=null;
const player=state.candidates.find(c=>c.id===state.local_candidate_id);
state.candidates.filter(c=>c!==player).forEach(c=>c.disappeared=true);
state.npcs=[];state.temporary_units=[];
const renderer=new WorldRenderer(document.querySelector('#game'),config);
const zoneSelect=document.querySelector('#zone'), join=document.querySelector('#join'),season=document.querySelector('#season');
for(const zone of state.world.subzones){const option=new Option(`${zone.index+1} · ${zone.id}`,zone.id);zoneSelect.add(option);}
const requestedZone=new URLSearchParams(location.search).get('zone');
if(state.world.subzones.some(zone=>zone.id===requestedZone)) zoneSelect.value=requestedZone;
await renderer.assets.keep(worldAssetIds(renderer.assets.manifest,state));
function draw(x){player.x=x;player.axis=0;renderer.resetCamera();renderer.draw(state,state,1,1/60,false);}
function refresh(){const zone=state.world.subzones[zoneSelect.selectedIndex];state.campaign_progress_01=Number(season.value);draw(join.checked?zone.start:zone.center);document.querySelector('#status').textContent=`${zone.id} · Zoom du jeu conservé · Portes : 1,15 × la hauteur du personnage`;
}
zoneSelect.onchange=join.onchange=season.onchange=refresh;
document.querySelector('#previous').onclick=()=>{zoneSelect.selectedIndex=(zoneSelect.selectedIndex+17)%18;refresh();};
document.querySelector('#next').onclick=()=>{zoneSelect.selectedIndex=(zoneSelect.selectedIndex+1)%18;refresh();};
window.addEventListener('resize',()=>requestAnimationFrame(refresh));
new ResizeObserver(()=>requestAnimationFrame(refresh)).observe(renderer.canvas);
// Même cadre 16:9 que #game dans le jeu : le mode portrait ne doit pas étirer l'aperçu en hauteur.
new ResizeObserver(([entry])=>{
  renderer.canvas.style.width=Math.min(entry.contentRect.width,entry.contentRect.height*16/9)+'px';
}).observe(document.querySelector('#viewport'));
window.worldV2Preview={sim,renderer,draw,refresh};refresh();
// Le redimensionnement du canvas efface ses pixels : le redessiner à chaque image,
// comme dans le jeu, conserve l'aperçu après une rotation de téléphone.
function animate(){renderer.draw(state,state,1,1/60,false);requestAnimationFrame(animate);}
requestAnimationFrame(animate);
</script>
</html>
