<main><h1>Les services d’ordre de Mélenchon et Le Pen</h1>
<p>Douze personnages par camp : six hommes et six femmes, sans logos. Les syndicalistes et les ruraux défendent vos quartiers. Les cagoulés sont réservés aux raids et à la fermeture des bâtiments.</p>
