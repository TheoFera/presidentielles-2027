<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balade dans la fresque</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; overflow: hidden; font: 14px system-ui, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 12px; top: 10px; color: #fff; background: rgba(16,20,26,.72); padding: 8px 12px; border-radius: 8px; line-height: 1.45; max-width: 92vw; }
  #info b { color: #ffd98a; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="info">Chargement de la fresque…</div>
<script type="module">
  // Travelling automatique le long de toute la carte, avec le vrai moteur de rendu du jeu (décor « maquette »).
  // Touches : ← → vitesse et sens · Espace pause · S saison suivante · 1 à 6 aller au début d'un biome · M figer la foule.
  import { loadConfig } from '../../config.js';
  import { GameSimulation } from '../../simulation/game-simulation.js';
  import { WorldRenderer } from '../renderer.js';
  import { worldAssetIds } from '../illustrated-world.js';
  import { completePopulation } from '../../simulation/spawns.js';
  import { zoneAt } from '../../simulation/world.js';
  import { MAP_DECORS, currentMapDecor } from '../map-decor.js';
  const requestedDecor = new URLSearchParams(location.search).get('decor');
  if (requestedDecor !== 'maquette' && !MAP_DECORS.some(d => d.id === requestedDecor)) location.search = '?decor=maquette';
  document.title = `Balade — ${MAP_DECORS.find(d => d.id === currentMapDecor())?.label || 'Fresque'}`;
  const config = await loadConfig();
  config.balance.campaign_events.event_enabled = false;
  const sim = new GameSimulation(config, 7); sim.state.ai_enabled = false;
  completePopulation(sim);
  const state = sim.state, player = state.candidates[0];
  player.interaction_active = false; player.campaign_active = false;
  const renderer = new WorldRenderer(document.getElementById('game'), config);
  await renderer.assets.keep(worldAssetIds(renderer.assets.manifest, state));
  const info = document.getElementById('info');
  const seasons = [[0.1, 'automne'], [0.55, 'hiver'], [0.8, 'printemps'], [0.97, 'été']];
  let speed = 5, paused = false, season = 0, last = performance.now(), frames = 0, fpsTime = last, fps = 0, worst = 0;
  state.campaign_progress_01 = seasons[0][0];
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') speed = Math.min(40, speed + 2);
    if (e.key === 'ArrowLeft') speed = Math.max(-40, speed - 2);
    if (e.key === ' ') paused = !paused;
    if (e.key.toLowerCase() === 's') { season = (season + 1) % seasons.length; state.campaign_progress_01 = seasons[season][0]; }
    if (/^[1-6]$/.test(e.key)) { player.x = (Number(e.key) - 1) * 72; renderer.resetCamera(); }
  });
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!paused) player.x = (player.x + speed * dt + state.world.length) % state.world.length;
    state.tick++;
    const t0 = performance.now();
    renderer.draw(state, state, 1, dt, false);
    const cost = performance.now() - t0; worst = Math.max(worst, cost);
    frames++;
    if (now - fpsTime > 1000) { fps = frames * 1000 / (now - fpsTime); frames = 0; fpsTime = now; info.dataset.worst = worst.toFixed(1); worst = 0; }
    const zone = zoneAt(state.world, player.x);
    info.innerHTML = `<b>${zone.id.replace('_', ' ')}</b> · x = ${player.x.toFixed(1)} · saison : ${seasons[season][1]}<br>`
      + `${fps.toFixed(0)} images/s · pire image : ${info.dataset.worst || '–'} ms · vitesse ${speed}<br>`
      + `tuiles peintes : ${renderer.fresqueStats?.tiles || 0} · moyenne ${((renderer.fresqueStats?.total || 0) / Math.max(1, renderer.fresqueStats?.tiles || 0)).toFixed(0)} ms · pires : ${Object.entries(renderer.fresqueStats?.worst || {}).map(([k, v]) => k + ' ' + v.toFixed(0)).join(', ')}<br>`
      + `← → vitesse · Espace pause · S saison · 1-6 biome`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
