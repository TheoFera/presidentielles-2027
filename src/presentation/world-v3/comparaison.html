<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Comparaison storyboard / jeu</title>
<style>
  body { margin: 0; background: #1d2126; color: #eee; font: 14px system-ui, sans-serif; width: 2200px; }
  h1 { font-size: 20px; margin: 8px 12px; } p { margin: 4px 12px; color: #cfd6dc; max-width: 2160px; }
  .photos { display: flex; gap: 6px; padding: 6px 12px; flex-wrap: nowrap; }
  .photos figure { margin: 0; width: 300px; } .photos img { width: 300px; height: 200px; object-fit: cover; display: block; }
  figcaption { font-size: 11px; color: #9aa6b0; }
  canvas { display: block; margin: 6px 12px; width: 1280px; height: 360px; }
  #vues { display: flex; gap: 8px; margin: 0 12px; } #vues img { width: 520px; }
</style>
</head>
<body>
<h1 id="titre"></h1><p id="retenir"></p>
<div class="photos" id="photos"></div>
<div id="vues"></div>
<canvas id="game" style="position:absolute; left:-4000px; width:1280px; height:720px"></canvas>
<script type="module">
  // Pour une sous-zone (?zone=banlieue_b) : photos du storyboard, puis trois vues réelles du jeu (début, centre, fin).
  import { loadConfig } from '../../config.js';
  import { GameSimulation } from '../../simulation/game-simulation.js';
  import { WorldRenderer } from '../renderer.js';
  import { worldAssetIds } from '../illustrated-world.js';
  import { completePopulation } from '../../simulation/spawns.js';
  const params = new URLSearchParams(location.search), zoneId = params.get('zone') || 'paris_a';
  const board = await (await fetch('/docs/production/decor-v3/storyboard-photos.json').catch(() => null))?.json().catch(() => null);
  const entry = (Array.isArray(board) ? board : board?.zones || Object.values(board || {})).find(s => s.id === zoneId) || {};
  document.getElementById('titre').textContent = entry.title || zoneId;
  document.getElementById('retenir').textContent = `À retenir : ${entry.keep || ''} ${entry.note || ''}`;
  // Bande « Déjà dans le jeu » du storyboard v2 : extrait du panorama world-v2 et anciens fonds de parallaxe.
  const existing = [];
  if (Number.isInteger(entry.third)) existing.push({ crop: `/assets/generated/world-v2/panorama-${entry.art}.png`, third: entry.third, title: `Panorama world-v2, tiers ${'ABC'[entry.third]}` });
  for (const id of entry.existing || []) existing.push({ src: `/assets/generated/biomes/${id}.png`, title: `Ancien fond : ${id}` });
  for (const e of existing) {
    const f = document.createElement('figure');
    if (e.crop) { const d = document.createElement('div'); Object.assign(d.style, { width: '300px', height: '200px', backgroundImage: `url('${e.crop}')`, backgroundSize: '300% auto', backgroundPosition: `${e.third * 50}% 60%`, backgroundRepeat: 'no-repeat', backgroundColor: '#9ecbe0' }); f.append(d); }
    else { const i = document.createElement('img'); i.src = e.src; i.style.objectFit = 'contain'; i.style.background = '#b9d7e6'; f.append(i); }
    const c = document.createElement('figcaption'); c.textContent = e.title; c.style.color = '#e2b56a'; f.append(c); document.getElementById('photos').append(f);
  }
  for (const img of [...(entry.frontImages || []), ...(entry.backImages || [])]) {
    const f = document.createElement('figure'); const i = document.createElement('img'); i.src = img.local ? `/${img.local.replace(/^\.\.\//g, '')}` : img.thumb; f.append(i);
    const c = document.createElement('figcaption'); c.textContent = img.title; f.append(c); document.getElementById('photos').append(f);
  }
  const config = await loadConfig();
  config.balance.campaign_events.event_enabled = false;
  const sim = new GameSimulation(config, 42); sim.state.ai_enabled = false; completePopulation(sim);
  const state = sim.state, player = state.candidates[0];
  player.interaction_active = false; player.campaign_active = false;
  state.candidates.slice(1).filter(c => !c.minor).forEach(c => { c.disappeared = true; });
  state.npcs.forEach(n => { n.x = -1000; });
  const renderer = new WorldRenderer(document.getElementById('game'), config);
  await renderer.assets.keep(worldAssetIds(renderer.assets.manifest, state));
  const zone = state.world.subzones.find(z => z.id === zoneId);
  for (const t of [0.2, 0.5, 0.8]) {
    player.x = zone.start + zone.width * t; state.campaign_progress_01 = 0.1; renderer.resetCamera(); renderer.cameraX = player.x;
    renderer.draw(state, state, 1, 1 / 60, false);
    const img = document.createElement('img'); img.src = renderer.canvas.toDataURL('image/jpeg', 0.9); document.getElementById('vues').append(img);
  }
  await Promise.all([...document.images].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
  document.title = 'prêt';
</script>
</body>
</html>
