<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Planche de la fresque</title>
<style>body { margin: 0; background: #20242a; } canvas { display: block; }</style>
</head>
<body>
<canvas id="planche"></canvas>
<script type="module">
  // Planche d'essai : ?set=periurbain ; ?export=1 envoie l'image à scripts/world-v3-export.mjs.
  import { CATALOGUE } from './fresque/catalogue.js';
  const params = new URLSearchParams(location.search), set = params.get('set') || Object.keys(CATALOGUE)[0];
  const items = CATALOGUE[set], S = 2, PPU = 40, COLS = 2, CELL_H = 470, PAD = 30;
  const cellW = Math.max(...items.map(i => i.w * PPU + 200)) ;
  const canvas = document.getElementById('planche');
  canvas.width = cellW * COLS * S; canvas.height = Math.ceil(items.length / COLS) * CELL_H * S;
  const ctx = canvas.getContext('2d'); ctx.scale(S, S);
  ctx.fillStyle = '#cfdde7'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const person = (x, base) => { // silhouette de référence : 81 px, comme un personnage du jeu
    ctx.fillStyle = 'rgba(160,40,60,0.85)';
    ctx.beginPath(); ctx.arc(x, base - 70, 10, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x - 11, base - 59, 22, 34, 6); ctx.fill();
    ctx.fillRect(x - 9, base - 27, 7, 27); ctx.fillRect(x + 2, base - 27, 7, 27);
  };
  items.forEach((item, i) => {
    const cx = (i % COLS) * cellW, cy = Math.floor(i / COLS) * CELL_H, base = cy + CELL_H - PAD;
    ctx.fillStyle = i % 2 ? '#c8d8e4' : '#d4e1ea'; ctx.fillRect(cx, cy, cellW, CELL_H);
    ctx.fillStyle = '#b9ad94'; ctx.fillRect(cx, base, cellW, PAD);
    ctx.fillStyle = '#2b2b2b'; ctx.font = '600 14px system-ui'; ctx.fillText(item.name, cx + 12, cy + 20);
    person(cx + 40, base);
    ctx.save(); ctx.translate(cx + 90 + item.w * PPU / 2, base);
    item.draw(ctx, { ...item.p, w: item.w * PPU }, { unitPx: PPU, image: () => null, u: 1 });
    ctx.restore();
  });
  if (params.has('export')) { await fetch(`/__export?name=planche-${set}.png`, { method: 'POST', body: canvas.toDataURL('image/png') }); await fetch('/__export?name=fin', { method: 'POST', body: 'x,eA==' }); }
  document.title = 'Planche prête';
</script>
</body>
</html>
