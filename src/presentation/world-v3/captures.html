<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Captures du décor v3</title>
<style>body { margin: 0; background: #111; } #game { display: block; width: 1280px; height: 720px; } img { width: 640px; margin: 4px; }</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="list"></div>
<script type="module">
  // Rendu réel du jeu à des positions précises (centres et raccords des 18 sous-zones, saisons).
  // Ouvrir avec ?decor=maquette pour les maquettes ; ?export=1 envoie les PNG à scripts/world-v3-export.mjs.
  import { loadConfig } from '../../config.js';
  import { applyDecorPreview } from '../fixed-world.js';
  import { GameSimulation } from '../../simulation/game-simulation.js';
  import { WorldRenderer } from '../renderer.js';
  import { worldAssetIds } from '../illustrated-world.js';
  import { completePopulation } from '../../simulation/spawns.js';
  const config = applyDecorPreview(await loadConfig());
  config.balance.campaign_events.event_enabled = false;
  const sim = new GameSimulation(config, 42); sim.state.ai_enabled = false;
  completePopulation(sim);
  const state = sim.state, player = state.candidates[0];
  player.interaction_active = false; player.campaign_active = false;
  state.candidates.slice(1).filter(c => !c.minor).forEach(c => { c.disappeared = true; });
  const renderer = new WorldRenderer(document.getElementById('game'), config);
  await renderer.assets.keep(worldAssetIds(renderer.assets.manifest, state));
  const shots = {};
  const draw = (x, name, progress = 0.1) => {
    player.x = x; state.campaign_progress_01 = progress; renderer.resetCamera(); renderer.cameraX = x;
    renderer.draw(state, state, 1, 1 / 60, false);
    const small = document.createElement('canvas'); small.width = 960; small.height = 540;
    small.getContext('2d').drawImage(renderer.canvas, 0, 0, 960, 540);
    shots[name] = small.toDataURL('image/png');
  };
  state.world.subzones.forEach((zone, i) => draw(zone.center, `${String(i).padStart(2, '0')}-centre-${zone.id}.png`));
  state.world.subzones.forEach((zone, i) => draw(zone.start, `${String(i).padStart(2, '0')}-raccord-${zone.id}.png`));
  const paris = state.world.subzones[1];
  for (const [progress, season] of [[0.3, 'automne'], [0.55, 'hiver'], [0.8, 'printemps']]) draw(paris.center, `saison-${season}.png`, progress);
  const niel = state.funding_encounters.find(e => e.kind === 'tech');
  niel.candidate_id = player.id; niel.hold_ticks = 40; draw(niel.x - 0.6, 'financier.png'); niel.candidate_id = null; niel.hold_ticks = 0;
  if (new URLSearchParams(location.search).has('export'))
    for (const [name, data] of Object.entries(shots)) await fetch(`/__export?name=${encodeURIComponent(name)}`, { method: 'POST', body: data });
  else for (const data of Object.values(shots)) { const img = new Image(); img.src = data; document.getElementById('list').append(img); }
  document.title = 'Captures prêtes';
</script>
</body>
</html>
