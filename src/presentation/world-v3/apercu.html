<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes du décor v3</title>
<style>
  body { margin: 0; font: 15px system-ui, sans-serif; background: #e9ecef; color: #1d2a33; }
  header { padding: 16px 20px; background: #20313b; color: #fff; }
  header p { margin: 4px 0 0; opacity: .8; }
  section { padding: 12px 20px 24px; }
  h2 { margin: 18px 0 8px; font-size: 18px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px;
    background: repeating-conic-gradient(#d7dde2 0 25%, #f4f6f7 0 50%) 0 0 / 32px 32px; }
  figcaption { font-size: 13px; margin-top: 4px; color: #4a5a64; }
  @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><strong>Maquettes du décor v3</strong><p>À gauche : maquette propre à donner à ChatGPT. À droite : légende (ligne de sol, échelle d'un personnage, éléments).</p></header>
<section id="list"></section>
<script type="module">
  import { CANVAS, allDecorImages } from './spec.js';
  import { drawStreetBlockout, drawLayerBlockout } from './blockout.js';
  const list = document.getElementById('list');
  const exported = {};
  for (const image of allDecorImages()) {
    const title = document.createElement('h2'); title.textContent = `${image.file} — ${image.spec.title}`; list.append(title);
    const pair = document.createElement('div'); pair.className = 'pair'; list.append(pair);
    for (const legend of [false, true]) {
      const figure = document.createElement('figure'); figure.style.margin = 0;
      const canvas = document.createElement('canvas'); canvas.width = CANVAS.width; canvas.height = CANVAS.height;
      const ctx = canvas.getContext('2d');
      if (image.layer === 'street') drawStreetBlockout(ctx, image.spec, { legend });
      else drawLayerBlockout(ctx, image.spec, image.layer, { legend });
      const caption = document.createElement('figcaption'); caption.textContent = legend ? 'légende' : 'maquette';
      figure.append(canvas, caption); pair.append(figure);
      exported[image.file.replace('.png', legend ? '-legende.png' : '-maquette.png')] = canvas.toDataURL('image/png');
    }
  }
  // Avec ?export=1, scripts/world-v3-export.mjs reçoit chaque PNG.
  if (new URLSearchParams(location.search).has('export'))
    for (const [name, data] of Object.entries(exported)) await fetch(`/__export?name=${encodeURIComponent(name)}`, { method: 'POST', body: data });
  document.title = 'Maquettes prêtes';
</script>
</body>
</html>
