plugins {
    id 'com.android.application'
}

// Le jeu web optimisé, produit par « npm run build » à la racine du projet.
def webDir = rootProject.file('../dist')

// Publicités AdMob : identifiants à renseigner dans android/gradle.properties (voir docs/publicites.md).
// En version de test (debug), ce sont toujours les identifiants de test publics de Google : aucune vraie pub.
def admobTestAppId = 'ca-app-pub-3940256099942544~3347511713'
def admobTestInterstitialId = 'ca-app-pub-3940256099942544/1033173712'
def admobAppId = (findProperty('admobAppId') ?: '').trim()
def admobInterstitialId = (findProperty('admobInterstitialId') ?: '').trim()
if (!admobAppId || !admobInterstitialId) {
    logger.warn('AdMob non configuré (android/gradle.properties) : la version Play Store sera sans publicité.')
}

// Clé de signature pour le Play Store : voir android/LISEZMOI.md.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = 'fr.presidentielles2027.jeu'
    compileSdk = 36

    defaultConfig {
        applicationId = 'fr.presidentielles2027.jeu'
        minSdk = 24
        targetSdk = 36
        // À augmenter de 1 à chaque nouvelle version envoyée sur le Play Store.
        versionCode = 2
        versionName = '1.0.1'
        // Mesure de fluidité sur une version finale : « -PwebDebug=true » rend la page du jeu inspectable
        // depuis l'ordinateur (chrome://inspect). Désactivé par défaut : la version Play Store n'est pas concernée.
        buildConfigField 'boolean', 'WEB_DEBUG', (findProperty('webDebug') == 'true').toString()
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: admobTestAppId]
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${admobTestInterstitialId}\""
        }
        release {
            // Sans identifiants : le SDK exige quand même un identifiant d'appli, mais aucune pub n'est demandée.
            manifestPlaceholders = [admobAppId: admobAppId ?: admobTestAppId]
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${admobAppId ? admobInterstitialId : ''}\""
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Les fichiers du jeu sont servis depuis la racine des assets de l'application.
            assets.srcDirs = [webDir]
        }
    }

    androidResources {
        // Images déjà compressées : inutile de les recompresser dans l'APK.
        noCompress += ['webp', 'png']
    }
}

tasks.named('preBuild') {
    doFirst {
        if (!new File(webDir, 'index.html').exists()) {
            throw new GradleException('Le dossier dist/ est absent : lancez d\'abord « npm run build » à la racine du projet.')
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    // Connexion Google native (comptes PartageTonJeu) : Credential Manager + Sign in with Google.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // Publicités interstitielles (AdMob) et formulaire de consentement RGPD de Google (UMP).
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
