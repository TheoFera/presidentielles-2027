<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atelier de vérification visuelle</title>
<style>body{margin:0;background:#f4ecdb;color:#283a3c;font:14px system-ui}header{padding:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:flex;gap:5px;align-items:center}select,button{padding:6px;border:1px solid #776e5d;border-radius:5px;background:#fff9ed;color:#283a3c}canvas{display:block;width:100%;aspect-ratio:16/9}#status{padding:8px;font-size:12px}header[hidden]{display:none}</style>
<header><strong>Atelier visuel</strong><label>Sous-zone <select id="zone"></select></label><label>Position <select id="position"><option value="center">Centre</option><option value="start">Frontière gauche</option><option value="end">Frontière droite</option></select></label><label>Saison <select id="season"><option value="0">Été</option><option value="0.25">Automne</option><option value="0.5">Hiver</option><option value="0.75">Printemps</option></select></label><label>Candidat <select id="candidate"><option value="melenchon">Mélenchon</option><option value="le_pen">Le Pen</option><option value="philippe">Philippe</option></select></label><label>Sites <select id="sites"><option value="neutral">Neutres</option><option value="owned">Capturés N1</option><option value="level3">Capturés N3 / QG</option><option value="closing">Fermeture</option><option value="closed">Fermés</option></select></label><label>Animation <select id="animation"><option value="idle">Repos</option><option value="walk">Marche</option><option value="persuade">Persuasion</option><option value="attack">Combat</option><option value="hurt">Recul</option><option value="ko">KO</option></select></label><button id="scroll">Parcourir la boucle</button><button id="clean">Masquer les réglages</button></header>
<style>header{position:fixed;top:0;left:0;right:0;z-index:2;background:#f4ecdbed}canvas{width:100vw;height:100vh;aspect-ratio:auto}#status{position:fixed;bottom:0;left:0;margin:0;background:#f4ecdbdd}</style>
<canvas id="world" aria-label="Aperçu du rendu du jeu"></canvas><p id="status" role="status">Chargement des visuels…</p>
<script type="module" src="./qa.js"></script></html>
