<!doctype html><html lang="fr"><meta charset="utf-8"><title>Inventaire des illustrations</title><style>body{margin:18px;background:#88adac;color:#203638;font:14px system-ui}header{display:flex;align-items:center;gap:16px}h1{font-size:20px}select{padding:6px}main{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}figure{margin:0;background:#80a9ac;border:1px solid #45666b}img{display:block;width:100%;height:190px;object-fit:contain}figcaption{background:#f6ecd5;padding:5px;font-size:10px;overflow-wrap:anywhere}</style><header><h1>Inventaire visuel</h1><label>Famille <select id="family"><option value="building-">Bâtiments</option><option value="background-">Décors</option><option value="characters">Personnages</option></select></label></header><main></main><script type="module">
import {visualManifest} from '../src/presentation/visual-manifest.js';
const select=document.querySelector('select'),main=document.querySelector('main');
function draw(){main.replaceChildren();for(const [id,asset] of Object.entries(visualManifest).sort(([a],[b])=>a.localeCompare(b))){if(select.value==='characters'?!/^(character-|npc-|security-|crs-|journalist-)/.test(id):!id.startsWith(select.value))continue;const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=asset.file;img.alt=id;caption.textContent=id;figure.append(img,caption);main.append(figure);}}
select.onchange=draw;draw();
</script></html>
