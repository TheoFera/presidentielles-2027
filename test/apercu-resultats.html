<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aperçu des résultats (développement)</title>
  <!-- Outil de développement : absent du jeu et de l’export. Mêmes styles que index.html. -->
  <link rel="stylesheet" href="../src/style.css">
  <link rel="stylesheet" href="../src/presentation/interface/illustrated-ui.css">
  <link rel="stylesheet" href="../src/presentation/menus/start-menu.css">
  <link rel="stylesheet" href="../src/presentation/menus/game-menu.css">
  <link rel="stylesheet" href="../src/presentation/menus/election-results.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    .dev-bar { position: fixed; z-index: 100; top: 50%; left: 8px; display: flex; flex-direction: column; gap: 6px; padding: 8px; font: 12px system-ui; color: #fff; background: #000c; border-radius: 6px; translate: 0 -50%; }
  </style>
</head>
<body>
  <section id="results" class="election-results" aria-label="Résultats électoraux"></section>
  <form class="dev-bar">
    <select name="candidat"><option value="melenchon">Mélenchon</option><option value="le_pen">Le Pen</option><option value="philippe">Philippe</option></select>
    <select name="situation"><option value="qualification">1er tour · qualification</option><option value="elimination">1er tour · élimination</option><option value="victoire">2nd tour · victoire</option><option value="defaite">2nd tour · défaite</option></select>
    <button type="submit">Rejouer l’animation</button>
  </form>
  <script type="module">
    import { ElectionResults, electionModel } from '../src/presentation/menus/election-results.js';
    import { demoElectionState } from './election-demo.js';
    // ?candidat=le_pen&situation=victoire&fige=1&barre=0 : capture directe de l’état final.
    const params = new URLSearchParams(location.search), form = document.querySelector('.dev-bar');
    form.candidat.value = params.get('candidat') || 'melenchon';
    form.situation.value = params.get('situation') || 'qualification';
    form.hidden = params.get('barre') === '0';
    const display = new ElectionResults(document.getElementById('results'));
    const show = () => display.render(electionModel(demoElectionState(form.candidat.value, form.situation.value)),
      { preview: true, animate: params.get('fige') !== '1', onContinue: show, onReplay: show, onReturn: () => display.clear() });
    form.onchange = show; form.onsubmit = event => { event.preventDefault(); show(); };
    window.electionPreview = { display, show };
    show();
  </script>
</body>
</html>
